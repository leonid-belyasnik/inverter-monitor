name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04

    services:
      # MeasurementRepositoryTest, MigrationRunnerTest and ApiRoutesTest
      # connect to a real database through the libpq PG* variables.
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: inverter_test
          POSTGRES_USER: inverter
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inverter -d inverter_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: inverter_test
      PGUSER: inverter
      PGPASSWORD: test_password

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            make \
            pkg-config \
            libpq-dev \
            libboost-json-dev \
            libmosquitto-dev \
            libgtest-dev \
            postgresql-client

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Wait for PostgreSQL
        run: |
          timeout 60 bash -c \
            'until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; do sleep 1; done'

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

  ui:
    name: UI lint and build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
