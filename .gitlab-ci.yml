stages:
  - build
  - test
  - image

build:
  stage: build
  script:
    - apt-get update
    - apt-get install -y cmake g++ make pkg-config libpq-dev libboost-json-dev libmosquitto-dev libgtest-dev
    - cmake -S . -B build
    - cmake --build build -j2

  artifacts:
    paths:
      - build/
    expire_in: 1 day

ui:
  stage: build
  image: node:24
  script:
    - npm ci --prefix ui
    - npm run lint --prefix ui
    - npm run build --prefix ui

test:
  stage: test
  image: ubuntu:24.04

  services:
    - name: postgres:17
      alias: postgres

  variables:
    FF_NETWORK_PER_BUILD: "1"
    POSTGRES_DB: "inverter_test"
    POSTGRES_USER: "inverter"
    POSTGRES_PASSWORD: "test_password"
    PGHOST: "postgres"
    PGPORT: "5432"
    PGDATABASE: "inverter_test"
    PGUSER: "inverter"
    PGPASSWORD: "test_password"

  script:
    - apt-get update
    - apt-get install -y cmake libpq5 postgresql-client libboost-json1.83.0 libmosquitto1
    - until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 1; done
    - ctest --test-dir build --output-on-failure

publish_image:
  stage: image
  image: docker:cli

  variables:
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

  script:
    - apk add --no-cache skopeo
    - docker buildx create --name ci-builder --driver docker-container --use
    - docker buildx inspect --bootstrap
    - docker buildx build --platform linux/amd64,linux/arm64 --target runtime --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" --output type=oci,dest=multiarch-image.tar .
    - skopeo copy --all --dest-tls-verify=false --dest-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" oci-archive:multiarch-image.tar "docker://$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - skopeo copy --all --dest-tls-verify=false --dest-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" oci-archive:multiarch-image.tar "docker://$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

  rules:
    - if: '$CI_COMMIT_TAG'

publish_ui_image:
  stage: image
  image: docker:cli

  variables:
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

  script:
    - apk add --no-cache skopeo
    - docker buildx create --name ci-ui-builder --driver docker-container --use
    - docker buildx inspect --bootstrap
    - docker buildx build --platform linux/amd64,linux/arm64 --tag "$CI_REGISTRY_IMAGE/ui:$CI_COMMIT_TAG" --output type=oci,dest=ui-multiarch-image.tar ./ui
    - skopeo copy --all --dest-tls-verify=false --dest-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" oci-archive:ui-multiarch-image.tar "docker://$CI_REGISTRY_IMAGE/ui:$CI_COMMIT_TAG"
    - skopeo copy --all --dest-tls-verify=false --dest-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" oci-archive:ui-multiarch-image.tar "docker://$CI_REGISTRY_IMAGE/ui:$CI_COMMIT_SHORT_SHA"

  rules:
    - if: '$CI_COMMIT_TAG'
