stages:
  - build
  - test
  - image

build:
  stage: build
  script:
    - apt-get update
    - apt-get install -y cmake g++ make pkg-config libpq-dev libboost-json-dev libmosquitto-dev libgtest-dev
    - cmake -S . -B build
    - cmake --build build -j2

  artifacts:
    paths:
      - build/
    expire_in: 1 day

test:
  stage: test
  image: ubuntu:24.04

  services:
    - name: postgres:17
      alias: postgres

  variables:
    FF_NETWORK_PER_BUILD: "1"
    POSTGRES_DB: "inverter_test"
    POSTGRES_USER: "inverter"
    POSTGRES_PASSWORD: "test_password"
    PGHOST: "postgres"
    PGPORT: "5432"
    PGDATABASE: "inverter_test"
    PGUSER: "inverter"
    PGPASSWORD: "test_password"

  script:
    - apt-get update
    - apt-get install -y cmake libpq5 postgresql-client libboost-json1.83.0 libmosquitto1
    - until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 1; done
    - ctest --test-dir build --output-on-failure

publish_image:
  stage: image
  image: docker:cli

  variables:
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build --target runtime -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

  rules:
    - if: '$CI_COMMIT_TAG'
